<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="pt pd">
  <title id="pt">How I ship: commit to production</title>
  <desc id="pd">Code on GitHub, CI with GitHub Actions or Jenkins, multi-stage Docker builds, images pushed to Amazon ECR, deployed to EC2 or Nginx containers.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="#0d1117"/>
    <rect width="1200" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="none" stroke="#30363d"/>

  <text x="40" y="50" font-family="'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4" fill="#34d399">HOW I SHIP</text>
  <text x="152" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">every push → tested, containerized, deployed</text>

  <!-- flow line (sits under the boxes, visible in the gaps) -->
  <path id="track" d="M60 140H1140" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle r="6" fill="#67e8f9">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="12" fill="#67e8f9" opacity="0.25">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif">
    <!-- 01 -->
    <g transform="translate(40 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#a78bfa">01</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Code</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Git · GitHub</text>
    </g>
    <!-- 02 -->
    <g transform="translate(275 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#818cf8">02</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">CI pipeline</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Actions · Jenkins</text>
    </g>
    <!-- 03 -->
    <g transform="translate(510 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#22d3ee">03</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Containerize</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Docker multi-stage</text>
    </g>
    <!-- 04 -->
    <g transform="translate(745 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#fbbf24">04</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Registry</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Amazon ECR</text>
    </g>
    <!-- 05 -->
    <g transform="translate(980 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#34d399" stroke-opacity="0.8"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#34d399">05</text>
      <circle cx="154" cy="26" r="5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="146" y="30" text-anchor="end" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#34d399">live</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Deploy</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">AWS EC2 · Nginx</text>
    </g>
  </g>

  <text x="600" y="228" text-anchor="middle" font-family="'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#6e7681">in practice: Venu-Portfolio (Actions → ECR → EC2)  ·  BookYourStay (Jenkins → Docker → Nginx)</text>
</svg>
