<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 276" width="1200" height="276" role="img" aria-labelledby="ot od">
  <title id="ot">How I keep it running: SRE incident lifecycle on Citrix DaaS</title>
  <desc id="od">Detect with Grafana and Splunk, get alerted by PagerDuty, triage at L1 and L1.5 in Jira, resolve or escalate on Azure and AWS, then document in Confluence and Slack, and loop back to monitoring.</desc>
  <defs>
    <linearGradient id="obar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="oflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="oframe"><rect width="1200" height="276" rx="16"/></clipPath>
    <marker id="ohead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fb923c"/>
    </marker>
  </defs>

  <g clip-path="url(#oframe)">
    <rect width="1200" height="276" fill="#0d1117"/>
    <rect width="1200" height="4" fill="url(#obar)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="275" rx="16" fill="none" stroke="#30363d"/>

  <text x="40" y="50" font-family="'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4" fill="#fb923c">HOW I KEEP IT RUNNING</text>
  <text x="252" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">alert → triage → fix → learn, on Citrix DaaS</text>

  <!-- incident loop: across the stages, then back to monitoring -->
  <path id="loop" d="M130 140H1070V216H130Z" stroke="url(#oflow)" stroke-width="2" stroke-dasharray="6 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M600 216H560" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#ohead)"/>
  <text x="600" y="238" text-anchor="middle" font-family="'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6e7681">feed the fix back into dashboards, alerts and runbooks</text>
  <circle r="6" fill="#fb7185">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion>
  </circle>
  <circle r="12" fill="#fb7185" opacity="0.22">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion>
  </circle>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif">
    <!-- 01 -->
    <g transform="translate(40 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#fb923c" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#fb923c">01</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Detect</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Grafana · Splunk</text>
    </g>
    <!-- 02 -->
    <g transform="translate(275 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#fb7185" stroke-opacity="0.7"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#fb7185">02</text>
      <circle cx="154" cy="26" r="5" fill="#fb7185">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="146" y="30" text-anchor="end" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#fb7185">on-call</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Alert</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">PagerDuty</text>
    </g>
    <!-- 03 -->
    <g transform="translate(510 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#60a5fa">03</text>
      <text x="162" y="30" text-anchor="end" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#60a5fa">L1 / L1.5</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Triage</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Jira · Slack</text>
    </g>
    <!-- 04 -->
    <g transform="translate(745 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#a78bfa">04</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Resolve</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">fix · escalate</text>
    </g>
    <!-- 05 -->
    <g transform="translate(980 88)">
      <rect width="180" height="104" rx="12" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="18" y="30" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="12" fill="#22d3ee">05</text>
      <text x="18" y="60" font-size="21" font-weight="700" fill="#f0f6fc">Document</text>
      <text x="18" y="84" font-family="'Cascadia Code', SFMono-Regular, Consolas, monospace" font-size="13" fill="#9da7b3">Confluence</text>
    </g>
  </g>

  <text x="600" y="262" text-anchor="middle" font-family="'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b949e">Zensar · Citrix DaaS · deployments and production support across Azure and AWS</text>
</svg>
